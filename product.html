    <!-- كود صفحة المنتج -->
    <script>
        (function() {
            // =============================================
            // CONFIGURATION
            // =============================================
            const SITE_URL = 'https://purecosmo.shop/';
            const SITE_NAME = 'PURE COSMO';

            // ========== CART (localStorage) ==========
            const CART_KEY = 'pure_cosmo_cart';
            const VISITOR_KEY = 'pure_cosmo_visitor_id';

            function getVisitorId() {
                let id = localStorage.getItem(VISITOR_KEY);
                if (!id) { id = crypto.randomUUID(); localStorage.setItem(VISITOR_KEY, id); }
                return id;
            }

            function getCart() {
                try {
                    const data = JSON.parse(localStorage.getItem(CART_KEY));
                    if (data && data.visitor_id === getVisitorId()) return data;
                } catch(e) {}
                return { visitor_id: getVisitorId(), items: [], total: 0, updated_at: new Date().toISOString() };
            }

            function saveCart(cart) {
                cart.visitor_id = getVisitorId();
                cart.updated_at = new Date().toISOString();
                cart.total = cart.items.reduce((sum, item) => sum + (parseFloat(item.price) * item.qty), 0);
                localStorage.setItem(CART_KEY, JSON.stringify(cart));
                updateCartCounter();
            }

            function addToCart(productId, qty = 1) {
                const product = productsData.find(p => p.id === productId);
                if (!product) return;
                const cart = getCart();
                const existing = cart.items.find(item => item.id === productId);
                if (existing) existing.qty += qty;
                else cart.items.push({ 
                    id: productId, 
                    slug: product.slug, 
                    name: product.name, 
                    price: product.price, 
                    qty: qty, 
                    image: product.img, 
                    size: product.size || '' 
                });
                saveCart(cart);
                showToast(`✅ تمت إضافة ${product.name} إلى السلة`);
            }

            function updateCartCounter() {
                const cart = getCart();
                const count = cart.items.reduce((sum, item) => sum + item.qty, 0);
                document.getElementById('cartCount').textContent = count;
            }

            function showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toastMsg').textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // ========== قراءة معامل المنتج من الرابط ==========
            function getProductSlug() {
                const params = new URLSearchParams(window.location.search);
                return params.get('slug');
            }

            // ========== تحديث SEO ديناميكياً ==========
            function updateSEO(product) {
                const fullUrl = `${SITE_URL}product.html?slug=${product.slug}`;
                const imageUrl = `${SITE_URL}${product.img}`;
                const title = `${product.name} | ${SITE_NAME} - ${product.short_desc}`;
                const description = (product.description || product.short_desc).substring(0, 160);

                // Title & Description
                document.title = title;
                document.getElementById('pageDescription').content = description;
                document.getElementById('pageKeywords').content = `${product.name}, ${product.short_desc}, PURE COSMO, مستحضرات تجميل, العناية بالبشرة, كفر الشيخ`;

                // Canonical
                document.getElementById('canonicalLink').href = fullUrl;

                // Open Graph
                document.getElementById('ogTitle').content = title;
                document.getElementById('ogDescription').content = description;
                document.getElementById('ogUrl').content = fullUrl;
                document.getElementById('ogImage').content = imageUrl;
                document.getElementById('ogImageAlt').content = `${product.name} - ${SITE_NAME}`;
                document.getElementById('ogPrice').content = product.price;

                // Twitter
                document.getElementById('twitterTitle').content = title;
                document.getElementById('twitterDescription').content = description;
                document.getElementById('twitterImage').content = imageUrl;

                // Product Schema (JSON-LD)
                const productSchema = {
                    "@context": "https://schema.org",
                    "@type": "Product",
                    "name": product.name,
                    "description": product.description || product.short_desc,
                    "image": [imageUrl, `${SITE_URL}${product.img2 || product.img}`, `${SITE_URL}${product.img3 || product.img}`],
                    "brand": {
                        "@type": "Brand",
                        "name": SITE_NAME
                    },
                    "offers": {
                        "@type": "Offer",
                        "url": fullUrl,
                        "priceCurrency": "EGP",
                        "price": product.price,
                        "availability": "https://schema.org/InStock",
                        "priceValidUntil": new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                        "seller": {
                            "@type": "Organization",
                            "name": SITE_NAME
                        }
                    }
                };
                document.getElementById('productSchema').textContent = JSON.stringify(productSchema);

                // Breadcrumb Schema
                const breadcrumbSchema = {
                    "@context": "https://schema.org",
                    "@type": "BreadcrumbList",
                    "itemListElement": [
                        {
                            "@type": "ListItem",
                            "position": 1,
                            "name": "الرئيسية",
                            "item": SITE_URL
                        },
                        {
                            "@type": "ListItem",
                            "position": 2,
                            "name": "المنتجات",
                            "item": `${SITE_URL}#products`
                        },
                        {
                            "@type": "ListItem",
                            "position": 3,
                            "name": product.name,
                            "item": fullUrl
                        }
                    ]
                };
                document.getElementById('breadcrumbSchema').textContent = JSON.stringify(breadcrumbSchema);
            }

            // ========== عرض المنتج ==========
            function renderProduct() {
                const slug = getProductSlug();
                const container = document.getElementById('productContent');

                if (!slug) {
                    container.innerHTML = `
                        <div class="container" style="text-align:center;padding:60px 20px;">
                            <i class="fas fa-exclamation-circle" style="font-size:3rem;color:#d43f34;"></i>
                            <h2 style="margin-top:16px;">لم يتم تحديد المنتج</h2>
                            <p style="color:#888;">يرجى اختيار منتج من الصفحة الرئيسية</p>
                            <a href="index.html" class="btn-primary" style="display:inline-block;margin-top:16px;">العودة للرئيسية</a>
                        </div>
                    `;
                    return;
                }

                const product = productsData.find(p => p.slug === slug);

                if (!product) {
                    container.innerHTML = `
                        <div class="container" style="text-align:center;padding:60px 20px;">
                            <i class="fas fa-search" style="font-size:3rem;color:#d43f34;"></i>
                            <h2 style="margin-top:16px;">المنتج غير موجود</h2>
                            <p style="color:#888;">لم نتمكن من العثور على المنتج المطلوب</p>
                            <a href="index.html" class="btn-primary" style="display:inline-block;margin-top:16px;">العودة للرئيسية</a>
                        </div>
                    `;
                    return;
                }

                // تحديث SEO
                updateSEO(product);

                // الصور المتوفرة
                const availableImages = [];
                if (product.img) availableImages.push(product.img);
                if (product.img2) availableImages.push(product.img2);
                if (product.img3) availableImages.push(product.img3);

                const related = productsData.filter(p => p.id !== product.id).slice(0, 4);
                const discount = product.old_price ? Math.round((1 - parseFloat(product.price)/parseFloat(product.old_price)) * 100) : 0;

                container.innerHTML = `
                    <div class="container">
                        <!-- Breadcrumb -->
                        <nav class="breadcrumb" aria-label="breadcrumb">
                            <a href="index.html">الرئيسية</a>
                            <span>←</span>
                            <a href="index.html#products">المنتجات</a>
                            <span>←</span>
                            <span class="current">${product.name}</span>
                        </nav>

                        <!-- Product Hero -->
                        <div class="product-hero">
                            <div>
                                <img src="${product.img}" id="mainProductImage" alt="${product.name} من PURE COSMO - ${product.short_desc}" class="product-image" width="500" height="500" fetchpriority="high" decoding="async">
                                <div class="product-thumbs">
                                    ${availableImages.map((img, i) => `
                                        <img src="${img}" class="thumb-img ${i === 0 ? 'active' : ''}" 
                                             onclick="document.getElementById('mainProductImage').src=this.src; document.querySelectorAll('.thumb-img').forEach(t=>t.classList.remove('active')); this.classList.add('active');"
                                             alt="${product.name} - صورة ${i + 1}"
                                             width="80" height="80" loading="lazy">
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                                <h1 class="product-name">${product.name}</h1>
                                <p class="product-desc">${product.description || product.short_desc}</p>
                                
                                <div class="product-price">
                                    <span class="current">${product.price} جنيه</span>
                                    ${product.old_price ? `<span class="old">${product.old_price} جنيه</span>` : ''}
                                    ${discount > 0 ? `<span class="discount">خصم ${discount}%</span>` : ''}
                                </div>
                                
                                <div class="product-stock">✅ متوفر في المخزون</div>
                                
                                <div class="product-size">
                                    <p><strong>الحجم:</strong> ${product.size || 'غير محدد'}</p>
                                </div>

                                <div class="product-actions">
                                    <label style="font-weight:700;" for="detailQty">الكمية:</label>
                                    <input type="number" id="detailQty" value="1" min="1" aria-label="الكمية">
                                    <button class="btn-add-cart" data-id="${product.id}"><i class="fas fa-cart-plus"></i> أضف إلى السلة</button>
                                    <button class="btn-buy-now" data-id="${product.id}"><i class="fas fa-bolt"></i> اطلب الآن</button>
                                </div>
                            </div>
                        </div>

                        <!-- Product Details Tabs -->
                        <section class="product-details-tabs">
                            <div class="tabs-header">
                                <span class="tab-btn active" data-tab="desc">الوصف</span>
                                <span class="tab-btn" data-tab="features">المميزات</span>
                                <span class="tab-btn" data-tab="usage">طريقة الاستخدام</span>
                                <span class="tab-btn" data-tab="info">معلومات إضافية</span>
                            </div>
                            <div class="tab-content active" id="tab-desc">
                                <h3>وصف المنتج</h3>
                                <p>${product.description || product.short_desc}</p>
                            </div>
                            <div class="tab-content" id="tab-features">
                                <h3>المميزات</h3>
                                <ul>
                                    ${product.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="tab-content" id="tab-usage">
                                <h3>طريقة الاستخدام</h3>
                                <p>${product.usage || 'اتبع التعليمات المدونة على العبوة.'}</p>
                            </div>
                            <div class="tab-content" id="tab-info">
                                <h3>معلومات إضافية</h3>
                                <p><strong>الحجم:</strong> ${product.size || 'غير محدد'}</p>
                                <p><strong>نوع العبوة:</strong> عبوة أنيقة</p>
                                <p><strong>بلد المنشأ:</strong> مصر</p>
                            </div>
                        </section>

                        <!-- FAQ -->
                        <section class="faq-section">
                            <h3 style="font-size:1.4rem;font-weight:800;margin-bottom:16px;">الأسئلة الشائعة حول ${product.name}</h3>
                            <div class="faq-item">
                                <div class="faq-question" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
                                    <span>ما هي مدة استخدام المنتج؟</span>
                                    <span>+</span>
                                </div>
                                <div class="faq-answer">يمكن استخدامه يومياً حسب التعليمات، ويفضل استشارة مختص للحصول على أفضل النتائج.</div>
                            </div>
                            <div class="faq-item">
                                <div class="faq-question" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
                                    <span>هل المنتج مناسب للبشرة الحساسة؟</span>
                                    <span>+</span>
                                </div>
                                <div class="faq-answer">نعم، المنتج مصمم بعناية ليكون لطيفاً على جميع أنواع البشرة بما في ذلك الحساسة.</div>
                            </div>
                            <div class="faq-item">
                                <div class="faq-question" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
                                    <span>ما هي مدة صلاحية المنتج؟</span>
                                    <span>+</span>
                                </div>
                                <div class="faq-answer">مدة الصلاحية موضحة على العبوة، وعادة ما تكون 24 شهراً من تاريخ الإنتاج.</div>
                            </div>
                        </section>

                        <!-- Related Products -->
                        <section class="related-products">
                            <h3 style="font-size:1.6rem;font-weight:800;margin-bottom:20px;">🛍️ منتجات قد تهمك</h3>
                            <div class="related-grid">
                                ${related.map(p => `
                                    <a href="product.html?slug=${p.slug}" class="related-card">
                                        <img src="${p.img}" alt="${p.name} من PURE COSMO" loading="lazy" width="200" height="120">
                                        <h4>${p.name}</h4>
                                        <div class="price">${p.price} جنيه</div>
                                    </a>
                                `).join('')}
                            </div>
                        </section>
                    </div>
                `;

                // ========== ربط الأزرار ==========
                container.querySelector('.btn-add-cart')?.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const qty = parseInt(document.getElementById('detailQty').value) || 1;
                    addToCart(id, qty);
                });

                container.querySelector('.btn-buy-now')?.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const qty = parseInt(document.getElementById('detailQty').value) || 1;
                    addToCart(id, qty);
                    window.location.href = 'cart.html';
                });

                // ========== Tabs ==========
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
                    });
                });

                updateCartCounter();
            }

            // ========== أيقونة السلة ==========
            document.getElementById('cartIcon').addEventListener('click', function() {
                window.location.href = 'cart.html';
            });

            // ========== أيقونة البحث ==========
            document.getElementById('searchIcon').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            // ========== تشغيل الصفحة ==========
            document.addEventListener('DOMContentLoaded', function() {
                renderProduct();
                updateCartCounter();
            });

            console.log('📄 Product Page loaded successfully!');
            console.log('📦 Cart:', getCart());

        })();
    </script>
</body>
</html>
